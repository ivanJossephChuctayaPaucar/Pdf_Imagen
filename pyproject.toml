[project]
name = "pdf-to-image"
version = "1.0.0"
description = "Conversor local de PDF a JPG o PNG de alta calidad para Windows"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=2.1,<3.0",
    "pillow>=12.0",
    "customtkinter>=5.2",
    "tkinterdnd2>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
